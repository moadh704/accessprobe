# AccessProbe Example Configuration (Recommended style)
# cookie_file paths are resolved relative to THIS config file.

sessions:
  - name: user
    cookie_file: cookies/user.txt
    description: "Low privilege user account"

  - name: admin
    cookie_file: cookies/admin.txt
    description: "Administrator account"

scan:
  target:
    url: "https://vulnerable-app.example.com/profile"
    description: "User profile endpoint"

  original_role: user
  test_roles:
    - admin

  method: GET

  parameters:
    - name: user_id
      location: query
      value: "42"
    # path example:
    # - name: id
    #   location: path
    #   value: "42"
    # (use URL like https://app.example.com/users/{id})

# You can still use raw cookies if preferred:
#  - name: user
#    cookies:
#      session: "your_cookie_here"
