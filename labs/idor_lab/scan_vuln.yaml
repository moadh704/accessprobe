# Vulnerable profile endpoint — expect horizontal IDOR findings
sessions:
  - name: alice
    cookie_file: cookies/alice.txt
    description: "Low privilege user (owns user_id=1)"
  - name: bob
    cookie_file: cookies/bob.txt
    description: "Other user (owns user_id=2)"
  - name: admin
    cookie_file: cookies/admin.txt
    description: "Administrator"

scan:
  target:
    url: "http://127.0.0.1:8765/vuln/profile"
    description: "Broken object-level authorization profile API"
  original_role: alice
  test_roles:
    - bob
    - admin
  method: GET
  # Accuracy context — suppresses self-access FPs; admin still sees broken ACL
  # as non-privileged here so real horizontal IDORs remain visible for all roles.
  own_ids:
    alice: ["1"]
    bob: ["2"]
    admin: ["3"]
  parameters:
    - name: user_id
      location: query
      value: "1"
